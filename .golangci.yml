version: "2"
run:
  go: "1.25"
linters:
  enable:
    - asciicheck
    - durationcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - querylinter
    - revive
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
  settings:
    gocritic:
      disabled-checks:
        - singleCaseSwitch
    govet:
      disable:
        - inline
    revive:
      rules:
        - name: var-naming
          arguments:
            - - ID
              - API
              - HTTP
            - []
    custom:
      querylinter:
        type: module
        description: Look for incorrect use of querybuilder.Builder
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        text: tx\.Rollback
      - linters:
          - gosec
          - noctx
        path: _test\.go
    paths:
      - ui/node_modules
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/infrahq/infra)
  exclusions:
    generated: lax
    paths:
      - ui/node_modules
      - third_party$
      - builtin$
      - examples$
