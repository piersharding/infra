---
version: 0.2
ui:
  proxyUrl: http://localhost:3000
tls:
  ca: internal/server/testdata/pki/ca.crt
  caPrivateKey: internal/server/testdata/pki/ca.key

dbHost: localhost
dbName: infra
dbPort: 5432
dbUsername: infra
dbPassword: infra
# dbEncryptionKey: internal/server/testdata/encryption-key/key

# admin:
#   accessKeySecret: infra-admin-access-key
#   enable: true
#   enabled: true

# enableSignup: true
#
baseDomain: localhost

enableTelemetry: true
logLevel: debug
sessionDuration: 720h0m0s
sessionExtensionDeadline: 72h0m0s

addr:
  http: :8080
  https: :9443 # or whatever you prefer
  metrics: :9090

# Global role replacements — applied to all mapping rules during evaluation.
# Replaces the previous hardcoded logic (admin → cluster-admin, aivadmin → [aivadmin, admin]).
mappingRulesConfig:
  roleReplacements:
    - from: admin
      to: [cluster-admin]
    - from: aivadmin
      to: [aivadmin, admin]
  mappingRules:
    # Kubernetes example — role_template is required for kubernetes destinations.
    - name: Bootstrap Example K8s Rule
      sourceGroupRegex: Example
      destinationType: kubernetes
      nameTemplate: minikube-k8s
      namespaceTemplate: default
      roleTemplate: view
    # SSH example — role_template is optional (not used for SSH).
    - name: Bootstrap Example SSH Rule
      sourceGroupRegex: Example
      destinationType: ssh
      nameTemplate: ssh01

users:
  - infraRole: admin
    name: dev@local
# users:
#   - accessKey: file:internal/server/testdata/initial-admin-access-key-secret/access-key
#     infraRole: admin
#     name: admin@local
#     password: file:internal/server/testdata/initial-admin-password-secret/password
