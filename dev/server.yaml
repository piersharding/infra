---
version: 0.2
ui:
  proxyUrl: http://localhost:3000
tls:
  ca: internal/server/testdata/pki/ca.crt
  caPrivateKey: internal/server/testdata/pki/ca.key

dbHost: localhost
dbName: infra
dbPort: 5432
dbUsername: infra
dbPassword: infra
# dbEncryptionKey: internal/server/testdata/encryption-key/key

# admin:
#   accessKeySecret: infra-admin-access-key
#   enable: true
#   enabled: true

# enableSignup: true
#
baseDomain: localhost

enableTelemetry: true
logLevel: debug
sessionDuration: 720h0m0s
sessionExtensionDeadline: 72h0m0s

addr:
  http: :8080
  https: :9443 # or whatever you prefer
  metrics: :9090

users:
  - infraRole: admin
    name: dev@local
    password: "password123!This"
# users:
#   - accessKey: file:internal/server/testdata/initial-admin-access-key-secret/access-key
#     infraRole: admin
#     name: admin@local
#     password: file:internal/server/testdata/initial-admin-password-secret/password
#
mappingRules:
  # Kubernetes example — role_template is required for kubernetes destinations.
  - name: platform-admins
    sourceGroupRegex: 'platform-.*'
    destinationType: kubernetes
    nameTemplate: cluster-platform-prod
    namespaceTemplate: platform
    roleTemplate: platform-admin
  # SSH example — role_template is optional (not used for SSH).
  - name: ssh-access
    sourceGroupRegex: 'ssh-.*'
    destinationType: ssh
    nameTemplate: bastion-hosts
